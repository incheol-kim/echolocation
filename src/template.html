<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echolocation</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body.playing { cursor: none; }
  #stage { position: absolute; overflow: hidden; background: #03060a; --u: 1; --hud: 0.85; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: absolute; left: calc(46px * var(--u)); top: calc(40px * var(--u)); opacity: var(--hud);
         font: calc(17px * var(--u)) / 1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: 0.08em;
         color: rgb(150, 255, 240); pointer-events: none; white-space: pre; text-shadow: 0 0 calc(6px * var(--u)) rgba(150,255,240,0.35); }
  #hud2 { opacity: 0.75; }
  #over { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
          background: rgba(3, 6, 10, 0.55); transition: opacity .6s; }
  #over.hide { opacity: 0; pointer-events: none; }
  #msg { font: 15px/1.6 ui-monospace, Consolas, monospace; letter-spacing: 0.12em; color: rgb(150, 255, 240); text-align: center; }
  /* video end card (#t= past the music): the page's end title in the same face and colour, sized for a video frame
     (the page's 15px reads too small in a video; user 2026-11-01), scaled with the frame so 4K matches 1080p */
  #credit { display: none; font: calc(37px * var(--u)) / 1.6 ui-monospace, Consolas, monospace; letter-spacing: 0.12em; color: rgba(150, 255, 240, 0.7);
            margin-top: calc(-5.5px * var(--u)); }   /* 32 px (1080p) between the two lines of text (user 2026-11-01) */
  #over.endcard { transition: none; cursor: default; }
  #over.endcard #msg { font-size: calc(46px * var(--u)); }
  #over.endcard #credit { display: block; }
  /* pause screen: one set of instructions for every device (a phone may have a keyboard too), and a timeline */
  #ctl { position: absolute; left: 0; right: 0; bottom: 0; padding: max(28px, calc(70px * var(--u))) max(16px, calc(46px * var(--u))) max(8px, calc(26px * var(--u)));
         display: none; background: linear-gradient(to top, rgba(3,6,10,0.9), rgba(3,6,10,0.65) 55%, rgba(3,6,10,0)); }
  #over.ready #ctl { display: block; }
  #hint { text-align: center; font: max(11px, calc(15px * var(--u))) / 1.5 ui-monospace, Consolas, monospace; color: rgba(150,255,240,0.8); letter-spacing: 0.06em; }
  #bar { display: flex; align-items: center; gap: 14px; height: max(34px, calc(48px * var(--u))); cursor: pointer; touch-action: none; }
  #track { position: relative; flex: 1; height: 3px; border-radius: 2px; background: rgba(150,255,240,0.2); }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; background: rgba(150,255,240,0.75); }
  #knob { position: absolute; top: 50%; left: 0; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%;
          background: rgb(150,255,240); box-shadow: 0 0 8px rgba(150,255,240,0.6); }
  #time { min-width: 7.5em; text-align: right; font: max(11px, calc(14px * var(--u))) ui-monospace, Consolas, monospace; color: rgba(150,255,240,0.75); letter-spacing: 0.06em; }
  #seekfx { position: absolute; top: 50%; transform: translateY(-50%); pointer-events: none; opacity: 0; transition: opacity .45s;
            font: 600 max(18px, calc(34px * var(--u))) ui-monospace, Consolas, monospace; letter-spacing: 0.1em; color: rgb(150,255,240);
            padding: 0.35em 0.8em; border-radius: 2em; background: rgba(3,6,10,0.6); text-shadow: 0 0 calc(10px * var(--u)) rgba(150,255,240,0.5); }
  #seekfx.L { left: 12%; } #seekfx.R { right: 12%; } #seekfx.on { opacity: 0.9; transition: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="hud"><div id="hud1"></div><div id="hud2"></div></div>
  <div id="seekfx"></div>
  <div id="over"><div id="msg">Restoring record…</div><div id="credit">Incheol Kim</div>
    <div id="ctl">
      <div id="hint">Tap or Space: play / pause · Double-tap left / right or ← / →: 5 s · Drag the bar: jump</div>
      <div id="bar"><div id="track"><div id="fill"></div><div id="knob"></div></div><div id="time">0:00 / 5:55</div></div>
    </div>
  </div>
</div>
<audio id="audio" src="echolocation.mp3" preload="auto"></audio>
<script>/*DATA*/</script>
<script>/*BAKED*/</script>
<script>/*CODE*/</script>
</body>
</html>
